<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恢复 PIN · 默</title><style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f2f2f7; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f7; } }
  main { width: min(440px, calc(100vw - 40px)); padding: 28px; border-radius: 18px;
         background: color-mix(in srgb, Canvas 92%, transparent);
         box-shadow: 0 12px 40px rgb(0 0 0 / 0.12); }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 16px; opacity: .72; font-size: 14px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; opacity: .8; }
  input, select { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 17px;
          border-radius: 12px; border: 1px solid #c7c7cc; background: Canvas; color: inherit; }
  input.code { font-family: ui-monospace, Consolas, monospace; letter-spacing: .12em; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 20px;
           padding: 13px; border: 0; border-radius: 12px; text-align: center;
           text-decoration: none; font-size: 16px; font-weight: 600;
           background: #0a84ff; color: white; }
  .error { margin-top: 15px; padding: 10px 12px; border-radius: 10px;
           background: #ff3b301a; color: #d70015; font-size: 14px; }
  .code { margin: 18px 0; padding: 18px; border-radius: 14px; text-align: center;
          font: 600 22px/1.4 ui-monospace, Consolas, monospace; letter-spacing: .12em;
          background: #0a84ff14; color: #0a84ff; word-break: break-all; }
  .hint { margin-top: 14px; font-size: 12px; opacity: .55; line-height: 1.6; }
</style></head><body><main>
  <h1>恢复 PIN</h1>
  <p>输入安装时保存的恢复码，换一个新 PIN。恢复码用过一次就会换新的。</p>
  <form method="post" action="/recover">
    <label>成员</label>
    <select name="member_id" required>
      {% for m in members %}
      <option value="{{ m.id }}" {% if m.id == selected %}selected{% endif %}>{{ m.name }}</option>
      {% endfor %}
    </select>
    <label>恢复码</label>
    <input class="code" name="code" placeholder="XXXX-XXXX-XXXX" autocomplete="one-time-code" autofocus required>
    <label>新 PIN（6 位数字）</label>
    <input name="pin" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" required>
    <label>再输一次</label>
    <input name="pin2" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" required>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">换新 PIN</button>
  </form>
  <p class="hint">恢复码也丢了？只能在运行服务的这台电脑上运行 scripts/reset_pin.py 重置。</p>
</main></body></html>
