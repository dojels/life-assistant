name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux 首次跑可能会暴露平台假设(路径分隔符、字体、SAPI 等)。
    # 如果 ubuntu 这一格红了而 windows 是绿的:要么修,要么把 ubuntu-latest
    # 从 os 矩阵里删掉,并把 README 的"已知限制"改成"仅支持 Windows"。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的控制台是 cp1252:不设这两条,任何一句中文 print 都会
      # UnicodeEncodeError 把步骤打死(首次跑 CI 就是这么红的)。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # 带上 [tts] 额外依赖:lameenc 决定音频是 mp3 还是 wav,
        # 少装它会让"说话要出音频文件"那条测试在 CI 上按降级路径红掉。
        run: pip install -e ".[tts]"

      - name: Self check (no network)
        run: python -m la --check
        env:
          LA_LLM_PROVIDER: fake
          LA_TICKER: "0"
          LA_DATA_DIR: ${{ runner.temp }}/la-data

      - name: Tests
        run: python -m unittest discover -s tests -t . -v 2>&1 | tail -n 40
        shell: bash
        env:
          LA_LLM_PROVIDER: fake
          LA_TICKER: "0"
          LA_DATA_DIR: ${{ runner.temp }}/la-data
